[package]
name = "next-gen-signatures-bench"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "signatures_bench"

[dependencies]
ark-ec = { version = "0.4.0" }
ark-ff = { version = "0.4.0" }
ark-serialize = { version = "0.4.2" }
ark-std = { version = "0.4.0" }
uniffi = { version = "=0.28.3", features = ["tokio"] }
next-gen-signatures = { git = "https://github.com/UbiqueInnovation/sprind-next-gen-signing-service", features = [
    "all",
] }
rdf-util = { git = "https://github.com/UbiqueInnovation/sprind-next-gen-signing-service" }
zkp-util = { git = "https://github.com/UbiqueInnovation/sprind-next-gen-signing-service" }
rand_core = { version = "0.6.4" }
serde_json = "1.0.140"
lazy_static = "1.5.0"
tokio = { version = "1.44.2", features = ["full"] }

[target.'cfg(any(target_os = "android"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[patch.crates-io]
wasmer = { git = "https://github.com/UbiqueInnovation/wasmer.git", tag = "v5.0.4" }
